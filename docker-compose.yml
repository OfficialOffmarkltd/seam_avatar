name: seam-avatar

services:

  # ── seam_avatar ─────────────────────────────────────────────────────────────
  seam_avatar:
    build: .
    depends_on:
      redis:
        condition: service_healthy
      localstack_init:
        condition: service_completed_successfully
    environment:
      # Required
      REDIS_URL:             redis://redis:6379/2
      AVATAR_CACHE_BUCKET:   seam-avatar-cache
      MAKEHUMAN_DATA_PATH:   /app/vendor/makehuman/data
      AWS_REGION:            us-east-1
      # LocalStack S3 override — remove in production
      AWS_ENDPOINT_URL:      http://localstack:4566
      AWS_ACCESS_KEY_ID:     test
      AWS_SECRET_ACCESS_KEY: test
      REDIS_QUEUE_NAME:      avatar
      BULLMQ_PREFIX:         bull
      # Optional — override defaults if needed
      LOG_LEVEL:             INFO
      CALIBRATION_MAX_SECONDS: "5"
      HEALTH_PORT:           "8081"
    ports:
      - "127.0.0.1:${SEAM_AVATAR_HEALTH_PORT:-8081}:8081"
    init: true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8081/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s   # allow time for MakeHuman data to load on cold start
    restart: unless-stopped

  # ── redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${SEAM_AVATAR_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── localstack (S3) ──────────────────────────────────────────────────────────
  localstack:
    image: localstack/localstack:latest
    environment:
      SERVICES:        s3
      DEFAULT_REGION:  us-east-1
      EAGER_SERVICE_LOADING: "1"
    ports:
      - "127.0.0.1:${SEAM_AVATAR_LOCALSTACK_PORT:-4566}:4566"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - localstack_data:/var/lib/localstack
    restart: unless-stopped

  # ── localstack init ──────────────────────────────────────────────────────────
  # Creates the S3 bucket on first startup so seam_avatar can upload immediately.
  localstack_init:
    image: amazon/aws-cli:latest
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID:     test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION:    us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        aws --endpoint-url=http://localstack:4566 s3api head-bucket
        --bucket seam-avatar-cache >/dev/null 2>&1 ||
        aws --endpoint-url=http://localstack:4566 s3 mb s3://seam-avatar-cache
        --region us-east-1
    restart: "no"

networks:
  default:
    name: seam-avatar

volumes:
  localstack_data:
  redis_data:
